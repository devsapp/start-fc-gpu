edition: 3.0.0
name: fc3-sched
access: "{{ access }}"
vars:
  region: "{{ region }}"
  prefix: "{{ namespace }}"
  otsEndpoint: "{{ otsEndpoint }}"
  otsInstance: "{{ otsInstance }}"
  otsTable: "{{ otsTable }}"
  roleArn: "{{roleArn}}"
  protocol: "{{ protocol }}"

resources:
  fc-sched-ops:
    component: fc3
    actions:
      success-deploy:
        - run: |
            s cli fc3 provision put --region ${this.props.region} --function-name ${this.props.functionName} --qualifier LATEST --target 1 --always-allocate-cpu true -a {{ access }}
            s cli fc3 concurrency put --region ${this.props.region} --function-name ${this.props.functionName} --reserved-concurrency 1 -a {{ access }}
          path: ./
    props:
      region: "${vars.region}"
      functionName: "${vars.prefix}-ops"
      description: "FC多集群调度解决方案 - 运维管控函数"
      role: ${vars.roleArn}
      runtime: custom.debian10
      code: ./fc-sched-ops
      handler: index.handler
      cpu: 1
      memorySize: 2048
      diskSize: 10240
      timeout: 600
      instanceConcurrency: 100
      internetAccess: true
      layers:
        - acs:fc:${vars.region}:official:layers/Python310-Package-Collection/versions/3
      customRuntimeConfig:
        port: 9000
        command:
          - python3
          - app.py
      environmentVariables:
        PATH: >-
          /var/fc/lang/python3.10/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/bin
        PYTHONPATH: /opt/python:/code
        LD_LIBRARY_PATH: >-
          /code:/code/lib:/usr/local/lib:/opt/lib:/opt/php8.1/lib:/opt/php8.0/lib:/opt/php7.2/lib
        OTS_ENDPOINT: "${vars.otsEndpoint}"
        OTS_INSTANCE_NAME: "${vars.otsInstance}"
        OTS_TABLE_NAME: "${vars.otsTable}"
      instanceLifecycleConfig:
        initializer:
          handler: 'true'
          timeout: 60
      triggers:
        - triggerConfig:
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            authType: anonymous
            disableURLInternet: false
          triggerName: defaultTrigger
          qualifier: LATEST
          triggerType: http

  fc-sched-core:
    component: fc3
    {{if protocol == 'websocket'}}
    actions:
      pre-${regex('deploy|local')}:
        - run: GO111MODULE=on go mod tidy
          path: ./fc-sched-core-ws
        - run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o target/main main.go
          path: ./fc-sched-core-ws
    {{/if}}
    props:
      region: "${vars.region}"
      functionName: "${vars.prefix}-core"
      description: "FC多集群调度解决方案 - 请求转发函数"
      role: ${vars.roleArn}
      runtime: custom.debian10
      code: {{if protocol == 'websocket'}}./fc-sched-core-ws/target{{else}}./fc-sched-core{{/if}}
      handler: index.handler
      cpu: 1
      memorySize: 2048
      diskSize: 10240
      timeout: 600
      instanceConcurrency: 1
      internetAccess: true
      {{if protocol != 'websocket'}}
      layers:
        - acs:fc:${vars.region}:official:layers/Python310-Package-Collection/versions/3
      {{/if}}
      customRuntimeConfig:
        port: 9000
        {{if protocol == 'websocket'}}
        command:
          - ./main
        {{else}}
        command:
          - python3
          - app.py
        {{/if}}
      environmentVariables:
        {{if protocol == 'websocket'}}
        PATH: >-
          /opt/Go1/bin:/usr/local/bin/apache-maven/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/ruby/bin:/opt/bin:/code:/code/bin
        {{else}}
        PATH: >-
          /var/fc/lang/python3.10/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/bin
        PYTHONPATH: /opt/python:/code
        {{/if}}
        LD_LIBRARY_PATH: >-
          /code:/code/lib:/usr/local/lib:/opt/lib:/opt/php8.1/lib:/opt/php8.0/lib:/opt/php7.2/lib
        OTS_ENDPOINT: "${vars.otsEndpoint}"
        OTS_INSTANCE_NAME: "${vars.otsInstance}"
        OTS_TABLE_NAME: "${vars.otsTable}"
      instanceLifecycleConfig:
        initializer:
          handler: 'true'
          timeout: 60
        preStop:
          handler: 'true'
          timeout: 60
      triggers:
        - triggerConfig:
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            authType: anonymous
            disableURLInternet: false
          triggerName: defaultTrigger
          qualifier: LATEST
          triggerType: http

  fc-sched-proxy:
    component: fc3
    props:
      region: "${vars.region}"
      functionName: "${vars.prefix}-proxy"
      description: "FC多集群调度解决方案 - 统一接入层函数"
      role: ${vars.roleArn}
      runtime: custom.debian10
      code: {{if protocol == 'websocket'}}./fc-sched-proxy-ws{{else}}./fc-sched-proxy{{/if}}
      handler: index.handler
      cpu: 1
      memorySize: 2048
      diskSize: 10240
      timeout: 600
      instanceConcurrency: 100
      internetAccess: true
      layers:
        - acs:fc:${vars.region}:official:layers/Nginx/versions/1
      customRuntimeConfig:
        command:
          - "/opt/bin/nginx"
          - "-c"
          - "/code/nginx.conf"
        port: 9000
      triggers:
        - triggerConfig:
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            authType: anonymous
            disableURLInternet: false
          triggerName: defaultTrigger
          qualifier: LATEST
          triggerType: http
