Edition: 3.0.0
Type: Project
Name: fc3-sched
Provider:
  - 阿里云
Version: 0.0.4
Description: 基于阿里云函数计算的多集群调度解决方案
HomePage: https://github.com/devsapp/start-fc-gpu/tree/v3
Tags:
  - 函数计算
  - 人工智能
  - GPU
Category: 人工智能
Organization: 阿里云函数计算（FC）
Service:
  函数计算:
    Authorities:
      - 创建函数
Effective: Public
Parameters:
  type: object
  additionalProperties: false # 不允许增加其他属性
  required: # 必填项
    - region
    - namespace
    - otsEndpoint
    - otsInstance
    - otsTable
    - protocol
  properties:
    region:
      title: 地域
      type: string
      default: cn-hangzhou
      description: 创建应用所在的地区
      enum:
        - cn-beijing
        - cn-hangzhou
        - cn-shanghai
        - cn-shenzhen
    namespace:
      title: 命名空间
      type: string
      default: fc-sched-${default-suffix}
      description: 命名空间将作为函数名的前缀，用以区分不同的应用。
    otsEndpoint:
      title: OTS Endpoint
      type: string
      description: OTS Endpoint地址,用于持久化用户自建GPU集群相关的元信息
    otsInstance:
      title: OTS Instance
      type: string
      default: fc-sched
      description: OTS Instance名称,用于持久化用户自建GPU集群相关的元信息
    otsTable:
      title: OTS Table
      type: string
      default: endpoints
      description: OTS Table名称,用于持久化用户自建GPU集群相关的元信息
    protocol:
      title: 转发协议
      type: string
      default: http/https
      description: 转发协议，支持http/https与websocket
      enum:
        - http/https
        - websocket
    roleArn:
      title: RAM 角色 ARN
      type: string
      default: ''
      pattern: '^acs:ram::[0-9]*:role/.*$'
      description: |
        函数计算访问云服务时使用的服务角色，需要填写具体的角色ARN，格式为acs:ram::$account-id>:role/$role-name。例如：acs:ram::14310000000:role/aliyunfcdefaultrole。
        如果您没有特殊要求，可以使用函数计算提供的默认的服务角色，即AliyunFCDefaultRole, 并增加 AliyunFCFullAccess 权限。如果您首次使用函数计算，可以访问 https://fcnext.console.aliyun.com 进行授权。
        详细文档参考 https://help.aliyun.com/document_detail/181589.html#section-o93-dbr-z6o"
      required: true
      x-role:
        name: fcdeployrole
        service: fc
        authorities:
          - AliyunFCDefaultRolePolicy
          - AliyunFCFullAccess
          - AliyunOTSFullAccess
          - AliyunOTSReadOnlyAccess
          - AliyunOTSWriteOnlyAccess
